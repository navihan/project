<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<!-- 📱 모바일 화면 최적화 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1분 평화명상</title>

<style>

/* 📱 전체 스타일 */
body{
    font-family: Arial;
    text-align:center;
    margin-top:50px;
    font-size:40px;
}

/* 🕒 큰 시계 */
#clock{
    font-size:100px;
    font-weight:bold;
    margin:30px 0;
}

/* 🔘 버튼 스타일 */
button{
    font-size:40px;
    padding:20px 0;
    border-radius:15px;
    margin:10px;
    width:300px;
    height:100px;
}

/* 🔴 상태 표시 */
#status{
    font-weight:bold;
    color:red;
}

</style>
</head>

<body>

<h2>1분 평화명상</h2>

<!-- 🕒 현재 시간 -->
<div id="clock">00:00:00</div>

<!-- ▶️ 시작 -->
<button onclick="playAudio()">▶️ 시작</button>

<!-- ⏸ 중지 -->
<button onclick="pauseAudio()">⏸ 중지</button>

<!-- 🔄 다시시작 -->
<button onclick="restartAudio()">🔄 재시작</button>

<br>

<!-- 🎵 추가 음악 -->
<button onclick="toggleExtraAudio()">AOM</button>

<!-- 🔘 알람 -->
<button onclick="toggleAlarm()">알람 토글</button>

<p>현재 상태: <span id="status">OFF</span></p>

<!-- 🔊 기본 음악 -->
<audio id="alarmSound">
    <source src="1min4peace.mp3" type="audio/mpeg">
</audio>

<!-- 🔊 추가 음악 -->
<audio id="extraSound" loop>
    <source src="aom.m4a" type="audio/mp4">
</audio>

<script>

/* ===============================
   🔧 변수
================================ */

let alarmEnabled = false;
let lastPlayed = "";

/* 추가 음악 상태 */
let isPlayingExtra = false;


/* ===============================
   ▶️ 기본 음악 재생
================================ */
function playAudio(){

    let main = document.getElementById("alarmSound");
    let extra = document.getElementById("extraSound");

    // 🔥 추가 음악 정지 (중복 방지)
    extra.pause();

    main.play().catch(e=>{
        console.log("재생 실패:", e);
    });
}


/* ===============================
   ⏸ 기본 음악 정지
================================ */
function pauseAudio(){

    let main = document.getElementById("alarmSound");
    main.pause();
}


/* ===============================
   🔄 기본 음악 다시시작
================================ */
function restartAudio(){

    let main = document.getElementById("alarmSound");
    let extra = document.getElementById("extraSound");

    // 🔥 추가 음악 정지
    extra.pause();

    main.currentTime = 0;
    main.play().catch(e=>{
        console.log("재생 실패:", e);
    });
}


/* ===============================
   🎵 추가 음악 토글
================================ */
function toggleExtraAudio(){

    let extra = document.getElementById("extraSound");
    let main = document.getElementById("alarmSound");

    if(!isPlayingExtra){

        // 🔥 기본 음악 정지
        main.pause();

        /*
        ▶️ 이어서 재생
        - 이전 위치 유지됨
        */
        extra.play().catch(e=>{
            console.log("재생 실패:", e);
        });

        isPlayingExtra = true;

    }else{

        /*
        ⏸ 멈춤 (위치 유지)
        */
        extra.pause();

        isPlayingExtra = false;
    }
}


/* ===============================
   🔘 알람 토글
================================ */
function toggleAlarm(){

    alarmEnabled = !alarmEnabled;

    if(alarmEnabled){
        document.getElementById("status").innerText = "ON";
    }else{
        document.getElementById("status").innerText = "OFF";

        let main = document.getElementById("alarmSound");
        main.pause();
        main.currentTime = 0;
    }
}


/* ===============================
   ⏱ 시간 체크
================================ */
function checkAlarm(){

    let now = new Date();

    let h = String(now.getHours()).padStart(2,'0');
    let m = String(now.getMinutes()).padStart(2,'0');
    let s = String(now.getSeconds()).padStart(2,'0');

    let currentTime = h + ":" + m + ":" + s;

    document.getElementById("clock").innerText = currentTime;

    if(!alarmEnabled) return;

    let hour = now.getHours();

    if(hour >= 9 && hour <= 21 && m === "00" && s === "00"){

        if(lastPlayed !== currentTime){

            let main = document.getElementById("alarmSound");
            let extra = document.getElementById("extraSound");

            // 🔥 추가 음악 정지
            extra.pause();

            main.play().catch(e=>{
                console.log("자동재생 차단");
            });

            lastPlayed = currentTime;
        }
    }
}

setInterval(checkAlarm,1000);

</script>

</body>
</html>
