<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<!-- 📱 모바일 화면 최적화 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>1분 평화명상</title>

<style>

/* 📱 전체 스타일 */
body{
    font-family: Arial;
    text-align:center;
    margin-top:50px;
    font-size:40px;
}

/* 🕒 큰 시계 */
#clock{
    font-size:100px;
    font-weight:bold;
    margin:30px 0;
}

/* 🔘 버튼 스타일 */
button{
    font-size:40px;
    padding:20px 0;        /* 좌우 패딩 제거 → width로 통일 */
    border-radius:15px;
    margin:10px;

    width:300px;           /* ⭐ 모든 버튼 가로 크기 동일 */
    height:100px;          /* ⭐ 높이도 고정 (선택사항) */
}

/* 🔴 상태 표시 */
#status{
    font-weight:bold;
    color:red;
}

</style>
</head>

<body>

<h2>1분 평화명상</h2>

<!-- 🕒 현재 시간 -->
<div id="clock">00:00:00</div>

<!-- ▶️ 시작 버튼 : 현재 위치에서 재생 -->
<button onclick="playAudio()">▶️ 시작</button>

<!-- ⏸ 중지 버튼 : 재생 멈춤 -->
<button onclick="pauseAudio()">⏸ 중지</button>

<!-- 🔄 다시시작 버튼 : 처음부터 재생 -->
<button onclick="restartAudio()">🔄 다시시작</button>
<br>
<!-- 🔘 알람 ON/OFF -->
<button onclick="toggleAlarm()">알람 토글</button>

<p>현재 상태: <span id="status">OFF</span></p>

<!-- 🔊 MP3 오디오 -->
<audio id="alarmSound" loop>
    <source src="1min4peace.mp3" type="audio/mpeg">
</audio>

<script>

/* ===============================
   🔧 변수
================================ */

/* 알람 ON/OFF 상태 */
let alarmEnabled = false;

/* 중복 알람 방지용 */
let lastPlayed = "";


/* ===============================
   ▶️ 시작 (현재 위치에서 재생)
================================ */
function playAudio(){

    let audio = document.getElementById("alarmSound");

    /* 
    🔊 play()
    - 현재 위치에서 이어서 재생
    - 사용자가 버튼 클릭 → 자동재생 차단 없음
    */
    audio.play().catch(e=>{
        console.log("재생 실패:", e);
    });
}


/* ===============================
   ⏸ 중지 (일시정지)
================================ */
function pauseAudio(){

    let audio = document.getElementById("alarmSound");

    /*
    ⏸ pause()
    - 현재 위치에서 멈춤
    - 다시 play()하면 이어서 재생됨
    */
    audio.pause();
}


/* ===============================
   🔄 다시시작 (처음부터 재생)
================================ */
function restartAudio(){

    let audio = document.getElementById("alarmSound");

    /*
    🔁 currentTime = 0
    - 재생 위치를 0초로 이동 (처음으로)
    */
    audio.currentTime = 0;

    /*
    ▶️ 다시 재생
    - 항상 처음부터 시작
    */
    audio.play().catch(e=>{
        console.log("재생 실패:", e);
    });
}


/* ===============================
   🔘 알람 토글
================================ */
function toggleAlarm(){

    alarmEnabled = !alarmEnabled;

    if(alarmEnabled){

        document.getElementById("status").innerText = "ON";

    }else{

        document.getElementById("status").innerText = "OFF";

        // 🔇 알람 끄면 소리 완전 정지 + 초기화
        let audio = document.getElementById("alarmSound");
        audio.pause();
        audio.currentTime = 0;
    }
}


/* ===============================
   ⏱ 1초마다 실행
================================ */
function checkAlarm(){

    let now = new Date();

    let h = String(now.getHours()).padStart(2,'0');
    let m = String(now.getMinutes()).padStart(2,'0');
    let s = String(now.getSeconds()).padStart(2,'0');

    let currentTime = h + ":" + m + ":" + s;

    /* 🕒 시계 표시 */
    document.getElementById("clock").innerText = currentTime;

    /* 알람 OFF면 종료 */
    if(!alarmEnabled) return;

    let hour = now.getHours();

    /* ⏰ 조건: 오전 9시 ~ 오후 9시 + 정각 */
    if(hour >= 9 && hour <= 21 && m === "00" && s === "00"){

        if(lastPlayed !== currentTime){

            let audio = document.getElementById("alarmSound");

            audio.play().catch(e=>{
                console.log("자동재생 차단 → 버튼 클릭 필요");
            });

            lastPlayed = currentTime;
        }
    }
}


/* 🔄 1초마다 실행 */
setInterval(checkAlarm,1000);

</script>

</body>
</html>
